<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Syntax Visualizer</title>
  <link rel="stylesheet" href="../source/styles/main.styl" media="screen" />
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Syvis</h1>
        <small>Version: <strong><code>{{version}}</code></strong></small>
      </div>
      <h2>The JavaScript Syntax Visualizer</h2>
    </header>

    <hr />

    <form id="formForExample">
      <fieldset>
        <legend>Pick one of the examples:</legend>

        <label>
          <input
            type="radio"
            name="example"
            id="example1"
            value="ifElse"
            checked
          >
          <span>If-else statement</span>
        </label>

        <label>
          <input
            type="radio"
            name="example"
            id="example2"
            value="addFunction"
          >
          <span>Function declaration</span>
        </label>

        <label>
          <input
            type="radio"
            name="example"
            id="example3"
            value="simpleObject"
          >
          <span>Simple object</span>
        </label>

        <label>
          <input
            type="radio"
            name="example"
            id="example4"
            value="chaining"
          >
          <span>Chaining</span>
        </label>

        <label>
          <input
            type="radio"
            name="example"
            id="example5"
            value="loops"
          >
          <span>Loops</span>
        </label>
      </fieldset>
    </form>

    <br>
    <br>
    <p>OR</p>
    <br>

    <p>Enter the URL to a JavaScript or JSON file:</p>

    <form id="fileUrl">
      <input
        id="fileUrlInput"
        type="text"
        name="fileUrl"
        placeholder="URL to a JavaScript or JSON file"
      />
      <button id="visualizeButton" type="submit">
        Visualize
      </button>
    </form>

    <hr />

    <form id="formForTheme">
      <fieldset>
        <legend>Pick a visualization theme:</legend>
        <label>
          <input
            type="radio"
            name="theme"
            id="themeNeo"
            value="themeNeo"
            checked
          >
          <span>Neo</span>
        </label>

        <label>
          <input
            type="radio"
            name="theme"
            id="themeClassic"
            value="themeClassic"
          >
          <span>Classic</span>
        </label>


        <label>
          <input
            type="radio"
            name="theme"
            id="themeDracula"
            value="themeDracula"
          >
          <span>Dracula</span>
        </label>

        <label>
          <input
            type="radio"
            name="theme"
            id="themeLisp"
            value="themeLisp"
          >
          <span>Lisp</span>
        </label>
      </fieldset>
    </form>

    <hr />

    <br />

    <div id="output" class="syvis"></div>
  </main>

  <script type="module" src="../source/index.ts"></script>
</body>

</html>
