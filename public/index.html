<!DOCTYPE html>
<html>
  <head>
    <meta charset=utf-8>
    <title>Syntax Visualizer</title>
    <link rel=stylesheet href=screen.css media=screen>
    <link rel=stylesheet href=theme/default.css>
  </head>
  <body>
    <main>
      <h1>Syvis</h1>
      <h2>The JavaScript Syntax Visualizer</h2>
      <p>
        <small>Version <code>{{version}}</code></small>
      </p>

      <form id=fileUrl>
        <input
          type=text
          name=fileUrl
          placeholder="URL to a JavaScript or JSON file">
        <button id=visualizeButton type=submit>Visualize</button>
      </form>

      <br>

      <div id=output class=syvis></div>
    </main>

    <script src=index.js></script>
  </body>
</html>
